<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>AV BOTZ | {{ file_name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="https://img.sanishtech.com/u/62e636411ff87f8ccbdd9eb50eb18279.png" type="image/x-icon">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- ArtPlayer Library -->
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://av-botz.vercel.app/2626/style.css">

    <style>
        :root { --accent-color: #00ff88; }
        
        /* Dark/Light Mode Fix */
        body { background: #0b0b0b; color: #fff; transition: 0.3s; }
        body.light-mode { background: #ffffff; color: #1a1a1a; }

        /* Notice Bar */
        .notice-bar {
            background: linear-gradient(90deg, #00ff88, #00b09b);
            color: #000;
            padding: 8px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
        }
        .notice-bar marquee { vertical-align: middle; }

        /* TikTok Style Adaptive Player */
        #videoContainer { 
            width: 100%; 
            max-width: 500px;
            margin: 15px auto; 
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .artplayer-app { width: 100%; height: auto; min-height: 250px; }

        /* Light Mode Button Fixes */
        body.light-mode .btn-glass {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid #ddd;
            color: #333 !important;
        }
        body.light-mode .glass-card {
            background: #f8f9fa;
            border: 1px solid #eee;
            color: #000;
        }
        body.light-mode .control-btn {
            background: #eee;
            color: #333;
        }

        #watchBtn { 
            width: 100%; padding: 45px 0; border: 2px dashed var(--accent-color); 
            border-radius: 15px; text-align: center; cursor: pointer; margin-top: 10px;
        }
        
        .control-btn { padding: 8px 12px; border-radius: 50%; border: none; background: rgba(255,255,255,0.1); color: #fff; }
        #eyeCareOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 165, 0, 0.12); pointer-events: none; z-index: 9999; display: none; }
        .watermark { position: absolute; top: 15px; right: 15px; font-size: 11px; color: rgba(255,255,255,0.5); z-index: 10; pointer-events: none; }
    </style>
</head>

<body class="dark-mode">
    <div id="eyeCareOverlay"></div>

    <!-- Notice Bar -->
    <div class="notice-bar">
        <marquee scrollamount="5"><i class="fa-solid fa-bullhorn"></i> Important: Use High-Speed Download for faster experience. Join @AV_BOTz_UPDATE for more!</marquee>
    </div>

    <nav class="navbar p-3">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="fw-bold"><i class="fa-solid fa-robot text-success"></i> AV BOTZ</span>
            <div class="d-flex gap-2">
                <button class="control-btn" onclick="toggleDarkMode()" id="themeToggle"><i class="fa-solid fa-sun"></i></button>
                <button class="control-btn" onclick="toggleEyeCare()"><i class="fa-solid fa-eye"></i></button>
            </div>
        </div>
    </nav>

    <main class="container">
        
        <!-- Adaptive Stream Player -->
        <div id="watchBtn" onclick="initPlayer()">
            <i class="fa-solid fa-circle-play fa-3x text-success"></i><br>
            <span class="mt-2 d-block fw-bold">WATCH ONLINE (STREAM)</span>
        </div>
        
        <div id="videoContainer" style="display:none;">
            <div class="artplayer-app"></div>
        </div>

        <!-- File Info Card -->
        <div class="glass-card mb-3 text-center p-3">
            <h6 class="mb-1 text-truncate">{{ file_name }}</h6>
            <small class="opacity-50">Size: {{ file_size }}</small>
        </div>

        <!-- Smart Download Buttons -->
        <div class="row g-2 mb-3">
            <div class="col-12">
                <button onclick="smartDownload('{{ file_url }}')" class="btn-glass w-100" style="background: linear-gradient(45deg, #00ff88, #00b09b); border:none; color: #000 !important; font-weight: 800;">
                    <i class="fa-solid fa-bolt"></i> FAST DOWNLOAD
                </button>
            </div>
            <div class="col-6">
                <button onclick="smartDownload('{{ file_url }}')" class="btn-glass w-100">
                    <i class="fa-solid fa-download"></i> DOWNLOAD
                </button>
            </div>
            <div class="col-6">
                <a href="{{ file_get }}" target="_blank" class="btn-glass w-100 btn-telegram" style="color: #0088cc !important;">
                    <i class="fa-brands fa-telegram"></i> GET FILE
                </a>
            </div>
        </div>

        <!-- Player Shortcuts -->
        <div class="row g-2 mb-4">
            <div class="col-4"><button onclick="play_intent('com.mxtech.videoplayer.ad')" class="btn-glass w-100 small">MX Player</button></div>
            <div class="col-4"><button onclick="play_intent('org.videolan.vlc')" class="btn-glass w-100 small">VLC Player</button></div>
            <div class="col-4"><button onclick="play_intent('com.playit.videoplayer')" class="btn-glass w-100 small">PlayIt</button></div>
        </div>

    </main>

    <script>
        // TikTok Style Player with Gestures & Swipe
        function initPlayer() {
            document.getElementById('watchBtn').style.display = 'none';
            document.getElementById('videoContainer').style.display = 'block';

            const art = new Artplayer({
                container: '.artplayer-app',
                url: '{{ file_url }}',
                title: '{{ file_name }}',
                autoSize: true, 
                playbackRate: true,
                aspectRatio: true,
                setting: true,
                fullscreen: true,
                pip: true,
                theme: '#00ff88',
                moreVideoAttr: { crossOrigin: 'anonymous', playsInline: true },
                controls: [
                    {
                        position: 'right',
                        html: '<i class="fa-solid fa-language"></i>',
                        tooltip: 'Subtitles',
                        selector: [
                            { html: 'English', url: '#' },
                            { html: 'Hindi', url: '#' },
                            { html: 'Bengali', url: '#' },
                        ],
                    },
                ],
                layers: [{ html: '<div class="watermark">@AV_BOTz_UPDATE</div>' }],
            });

            // Advanced Gestures (Double Tap to Skip & Play/Pause)
            let lastClickTime = 0;
            art.on('video:click', (event) => {
                const currentTime = new Date().getTime();
                const clickDelay = currentTime - lastClickTime;
                const rect = art.video.getBoundingClientRect();
                const x = event.clientX - rect.left;

                if (clickDelay < 300) { // Double Tap
                    if (x < rect.width / 3) {
                        art.backward = 10;
                        art.notice.show = 'Rewind 10s';
                    } else if (x > (rect.width / 3) * 2) {
                        art.forward = 10;
                        art.notice.show = 'Forward 10s';
                    } else {
                        art.toggle();
                    }
                }
                lastClickTime = currentTime;
            });

            // Enable Swipe Gestures (Brightness & Volume)
            art.on('ready', () => {
                // ArtPlayer supports native swipe on mobile for brightness/volume
                art.notice.show = 'Swipe Up/Down for Volume & Brightness';
            });
        }

        // Instant Download Logic (Fixed for Mobile Browsers)
        function smartDownload(url) {
            window.location.href = url;
        }

        // Theme Toggle Fix
        function toggleDarkMode() {
            const body = document.body;
            const icon = document.querySelector('#themeToggle i');
            body.classList.toggle('light-mode');
            if (body.classList.contains('light-mode')) {
                icon.className = 'fa-solid fa-moon';
            } else {
                icon.className = 'fa-solid fa-sun';
            }
        }

        function toggleEyeCare() { 
            const overlay = document.getElementById('eyeCareOverlay');
            overlay.style.display = (overlay.style.display === 'block') ? 'none' : 'block';
        }

        function play_intent(pkg) {
            const videoUrl = "{{ file_url }}";
            window.location.href = `intent:${videoUrl}#Intent;package=${pkg};type=video/*;end`;
        }
    </script>
</body>
</html>
