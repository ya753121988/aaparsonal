<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>AV BOTZ | {{ file_name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="https://img.sanishtech.com/u/62e636411ff87f8ccbdd9eb50eb18279.png" type="image/x-icon">
    
    <!-- Font and UI Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <!-- Video Player Library (ArtPlayer) -->
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>

    <style>
        :root {
            --accent-color: #00ff88;
            --bg-dark: #0b0b0b;
            --card-dark: #161616;
            --text-white: #ffffff;
            --btn-telegram: #0088cc;
        }

        /* Basic Setup */
        body {
            background: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        /* Light Mode Styling - ১০০% ক্লিয়ার বাটন ফিক্স */
        body.light-mode {
            background: #f1f3f5;
            color: #1a1a1a;
        }
        body.light-mode .glass-card {
            background: #ffffff !important;
            border: 1px solid #ddd !important;
            color: #1a1a1a !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        body.light-mode .btn-glass {
            background: #ffffff !important;
            border: 1px solid #ccc !important;
            color: #1a1a1a !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        body.light-mode .control-btn {
            background: #e9ecef;
            color: #000;
        }

        /* Notice Bar */
        .notice-bar {
            background: linear-gradient(90deg, #00ff88, #00b09b);
            color: #000;
            padding: 10px;
            font-size: 13px;
            font-weight: 800;
            text-align: center;
            border-bottom: 2px solid rgba(0,0,0,0.1);
        }

        /* Navbar */
        .navbar {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* Player Section (Adaptive TikTok Style) */
        .main-container {
            padding: 20px 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        #watchBtn {
            width: 100%;
            padding: 50px 20px;
            border: 2px dashed var(--accent-color);
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            background: rgba(0, 255, 136, 0.05);
            margin-bottom: 20px;
        }

        #video-wrapper {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: none;
            margin-bottom: 20px;
        }
        .artplayer-app {
            width: 100%;
            height: auto;
            min-height: 300px;
        }

        /* UI Cards & Buttons */
        .glass-card {
            background: var(--card-dark);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
        }

        .btn-glass {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none !important;
            font-weight: 600;
            margin-bottom: 5px;
            transition: 0.2s;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .btn-telegram { color: #fff !important; background: var(--btn-telegram) !important; border: none; }
        
        .control-btn {
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .watermark {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            z-index: 10;
            pointer-events: none;
            font-weight: bold;
        }

        #eyeCareOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 165, 0, 0.12);
            pointer-events: none;
            z-index: 9999;
            display: none;
        }
    </style>
</head>
<body>

    <div id="eyeCareOverlay"></div>

    <!-- Notice Bar -->
    <div class="notice-bar">
        <marquee scrollamount="6">⚡ High Speed Downloading Enabled! | Double Tap to Skip 10s | Join @AV_BOTz_UPDATE for Latest Updates.</marquee>
    </div>

    <!-- Navbar -->
    <nav class="navbar d-flex justify-content-between align-items-center">
        <div class="fw-bold fs-4"><i class="fa-solid fa-robot text-success"></i> AV BOTZ</div>
        <div class="d-flex gap-2">
            <button class="control-btn" onclick="toggleDarkMode()" id="themeToggle"><i class="fa-solid fa-sun"></i></button>
            <button class="control-btn" onclick="toggleEyeCare()"><i class="fa-solid fa-eye"></i></button>
        </div>
    </nav>

    <div class="main-container">
        
        <!-- Watch Button -->
        <div id="watchBtn" onclick="initPlayer()">
            <i class="fa-solid fa-play-circle fa-4x text-success mb-2"></i>
            <h5 class="fw-bold m-0">WATCH ONLINE</h5>
            <small class="opacity-50">Adaptive TikTok Style Player</small>
        </div>

        <!-- Adaptive Player Display -->
        <div id="video-wrapper">
            <div class="artplayer-app"></div>
        </div>

        <!-- File Details Card -->
        <div class="glass-card text-center mb-3">
            <div class="fw-bold text-truncate">{{ file_name }}</div>
            <div class="small opacity-50 mt-1">Size: {{ file_size }}</div>
        </div>

        <!-- Download Section (High Quality Downloader Logic) -->
        <div class="row g-2 mb-3">
            <div class="col-12">
                <div onclick="smartDownload('{{ file_url }}')" class="btn-glass py-3" style="background: linear-gradient(45deg, #00ff88, #00b09b); border:none; color: #000; font-weight: 800; font-size: 1.1rem;">
                    <i class="fa-solid fa-bolt"></i> HIGH SPEED DOWNLOAD
                </div>
            </div>
            <div class="col-6">
                <div onclick="smartDownload('{{ file_url }}')" class="btn-glass">
                    <i class="fa-solid fa-download"></i> DOWNLOAD
                </div>
            </div>
            <div class="col-6">
                <a href="{{ file_get }}" target="_blank" class="btn-glass btn-telegram">
                    <i class="fa-brands fa-telegram"></i> GET FILE
                </a>
            </div>
        </div>

        <!-- External Player Intent -->
        <div class="row g-2 mb-4 text-center">
            <div class="col-4"><div onclick="play_intent('com.mxtech.videoplayer.ad')" class="btn-glass small">MX Player</div></div>
            <div class="col-4"><div onclick="play_intent('org.videolan.vlc')" class="btn-glass small">VLC Player</div></div>
            <div class="col-4"><div onclick="play_intent('com.playit.videoplayer')" class="btn-glass small">PlayIt</div></div>
        </div>

        <footer class="text-center opacity-50 small py-3">
            @AV_BOTz_UPDATE &copy; 2025
        </footer>
    </div>

    <script>
        /**
         * High-Speed Browser Downloader Engine
         * এটি আপনার দেওয়া ফাইল ইউআরএল-কে ১ সেকেন্ডের মধ্যে ব্রাউজারে ইনজেক্ট করে ডাউনলোড শুরু করবে।
         */
        function smartDownload(url) {
            const fileName = "{{ file_name }}";
            // Create a temporary hidden link for instant trigger
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = fileName;
            anchor.target = '_blank';
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            
            // Emergency fallback for some restricted mobile browsers
            setTimeout(() => {
                window.location.assign(url);
            }, 500);
        }

        /**
         * Adaptive TikTok Style Player
         */
        function initPlayer() {
            document.getElementById('watchBtn').style.display = 'none';
            document.getElementById('video-wrapper').style.display = 'block';

            const art = new Artplayer({
                container: '.artplayer-app',
                url: '{{ file_url }}',
                title: '{{ file_name }}',
                autoSize: true,         // ভিডিওর সাইজ অনুযায়ী প্লেয়ার বড়/ছোট হবে
                playbackRate: true,
                aspectRatio: true,
                setting: true,
                fullscreen: true,
                pip: true,
                theme: '#00ff88',
                moreVideoAttr: {
                    crossOrigin: 'anonymous',
                    playsInline: true,
                },
                layers: [
                    {
                        html: '<div class="watermark">@AV_BOTz_UPDATE</div>',
                    },
                ],
                settings: [
                    {
                        html: 'Subtitles',
                        selector: [
                            { html: 'English', url: '#' },
                            { html: 'Hindi', url: '#' },
                            { html: 'Bengali', url: '#' },
                        ],
                    }
                ]
            });

            // Gestures: Double Tap detection (Center: Play/Pause, Left/Right: Skip 10s)
            let lastClickTime = 0;
            art.on('video:click', (event) => {
                const currentTime = new Date().getTime();
                const clickDelay = currentTime - lastClickTime;
                const rect = art.video.getBoundingClientRect();
                const x = event.clientX - rect.left;

                if (clickDelay < 300) { // Double tap detected
                    if (x < rect.width / 3) {
                        art.backward = 10;
                        art.notice.show = 'Rewind 10s';
                    } else if (x > (rect.width / 3) * 2) {
                        art.forward = 10;
                        art.notice.show = 'Forward 10s';
                    } else {
                        art.toggle();
                    }
                }
                lastClickTime = currentTime;
            });

            // Mobile Swipe: Volume & Brightness (Enabled natively in ArtPlayer)
            art.on('ready', () => {
                art.notice.show = 'Gestures: Double Tap to Seek | Swipe for Vol/Bright';
            });
        }

        // Theme Toggle Logic
        function toggleDarkMode() {
            const body = document.body;
            const icon = document.querySelector('#themeToggle i');
            body.classList.toggle('light-mode');
            if (body.classList.contains('light-mode')) {
                icon.className = 'fa-solid fa-moon';
            } else {
                icon.className = 'fa-solid fa-sun';
            }
        }

        // Eye Care Mode
        function toggleEyeCare() {
            const overlay = document.getElementById('eyeCareOverlay');
            overlay.style.display = (overlay.style.display === 'block') ? 'none' : 'block';
        }

        // External Player Opener
        function play_intent(pkg) {
            const videoUrl = "{{ file_url }}";
            window.location.href = `intent:${videoUrl}#Intent;package=${pkg};type=video/*;end`;
        }
    </script>

</body>
</html>
