<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8" />
    <title>AV BOTZ | {{ file_name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="https://img.sanishtech.com/u/62e636411ff87f8ccbdd9eb50eb18279.png" type="image/x-icon">

    <!-- Styles & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://av-botz.vercel.app/2626/style.css">

    <style>
        :root { --accent: #00d2ff; --pink-glow: #a55eea; --glass: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Outfit', sans-serif; background: #0a0a0b; color: white; margin: 0; padding: 0; overflow-x: hidden; }
        
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 20px 15px; }
        .info-box { background: var(--glass); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .info-box strong { color: var(--accent); font-size: 13px; display: block; margin-top: 2px; }

        .timer-box { background: rgba(255, 0, 0, 0.1); border: 1px solid rgba(255, 0, 0, 0.3); padding: 8px; margin: 0 15px 15px; border-radius: 8px; text-align: center; color: #ff6b6b; font-size: 12px; font-weight: bold; }

        .action-container { padding: 0 15px; }
        .main-btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; color: white; cursor: pointer; font-size: 16px; transition: 0.2s; }
        
        .btn-watch { background: linear-gradient(45deg, #a55eea, #4b7bec); box-shadow: 0 4px 15px rgba(165,94,234,0.4); }
        .btn-download { background: #2ecc71; box-shadow: 0 4px 15px rgba(46,204,113,0.3); }
        .btn-telegram { background: #0088cc; }
        
        .player-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 15px; }
        .p-btn { background: var(--glass); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); color: white; text-decoration: none; font-size: 12px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; cursor: pointer; }

        .link-container { margin: 25px 15px; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; border: 1px solid #222; }
        .link-box { width: 100%; background: #111; border: 1px solid #333; color: var(--pink-glow); padding: 10px; border-radius: 8px; font-size: 10px; margin-bottom: 10px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 3px solid var(--pink-glow); }

        /* --- Full Screen Stream Overlay (Improved) --- */
        #streamOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Close Button - Top Left corner */
        .close-stream { position: absolute; top: 15px; left: 15px; z-index: 10005; background: #ff4757; color: white; border: none; padding: 6px 14px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px; }

        /* Watermark - Top Right corner */
        .player-watermark { position: absolute; top: 18px; right: 18px; z-index: 10005; font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.4); pointer-events: none; }

        /* Video Container to fix "Red Gap" issue */
        .video-player-container { width: 100%; max-width: 1200px; max-height: 100vh; position: relative; }
        .plyr--video { border-radius: 0; }
    </style>
</head>

<body>
    <canvas id="particle-canvas"></canvas>

    <div id="mainUI">
        <!-- Data Boxes -->
        <div class="info-grid">
            <div class="info-box"><span>Movie Name</span><strong id="m-name">Parsing...</strong></div>
            <div class="info-box"><span>Language</span><strong id="m-lang">Multi Audio</strong></div>
            <div class="info-box"><span>Year</span><strong id="m-year">2024</strong></div>
            <div class="info-box"><span>Quality</span><strong id="m-quality">1080p</strong></div>
        </div>

        <div class="timer-box">
            <i class="fa-solid fa-clock"></i> ফাইল ডিলিট হতে বাকি: <span id="countdown">10:00</span>
        </div>

        <div class="action-container">
            <!-- Watch Online (Stream Link) -->
            <button class="main-btn btn-watch" onclick="startStream()">
                <i class="fa-solid fa-circle-play"></i> Watch Online
            </button>

            <!-- Download Button (Triggers Direct Download) -->
            <a href="{{ file_url }}" download="{{ file_name }}" class="main-btn btn-download">
                <i class="fa-solid fa-cloud-arrow-down"></i> Download File Now
            </a>

            <a href="{{ file_get }}" target="_blank" class="main-btn btn-telegram">
                <i class="fa-brands fa-telegram"></i> View in Telegram
            </a>
        </div>

        <!-- External Apps -->
        <div class="player-grid">
            <a onclick="openApp('com.mxtech.videoplayer.ad')" class="p-btn"><i class="fa-solid fa-play" style="color: #2196F3;"></i> MX Player</a>
            <a onclick="openApp('org.videolan.vlc')" class="p-btn"><i class="fa-solid fa-cone" style="color: #FF9800;"></i> VLC Player</a>
            <a onclick="openApp('com.playit.videoplayer')" class="p-btn"><i class="fa-solid fa-circle-play" style="color: #00C853;"></i> PlayIt Player</a>
            <a onclick="openApp('com.google.android.apps.photos')" class="p-btn"><i class="fa-brands fa-google" style="color: #ea4335;"></i> Google Photos</a>
            <a onclick="openApp('idm.internet.download.manager')" class="p-btn" style="grid-column: span 2; border-color: #00d2ff; color: #00d2ff;">
                <i class="fa-solid fa-bolt"></i> Stream in ADM/1DM (High Speed)
            </a>
        </div>

        <!-- Links (All use direct Stream Link) -->
        <div class="link-container">
            <span style="font-size: 11px; color:#777; margin-left: 5px;">Direct Stream Link:</span>
            <div class="link-box" onclick="copyText('{{ file_url }}')">{{ file_url }}</div>
            
            <span style="font-size: 11px; color:#777; margin-left: 5px;">Embed Code (Stream URL):</span>
            <div class="link-box" onclick="copyText('<iframe src=\'{{ file_url }}\' width=\'100%\' height=\'400\' allowfullscreen></iframe>')">
                {{ file_url }}
            </div>
        </div>
    </div>

    <!-- Overlay Stream Player -->
    <div id="streamOverlay" style="display: none;">
        <button class="close-stream" onclick="closeStream()">CLOSE X</button>
        <div class="player-watermark">@AV_BOTz_UPDATE</div>
        
        <div class="video-player-container">
            <video id="player" playsinline controls crossorigin="anonymous">
                <source src="{{ file_url }}" type="video/mp4" />
                <source src="{{ file_url }}" type="video/x-matroska" />
            </video>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        function parseInfo() {
            const fName = "{{ file_name }}";
            const year = fName.match(/(19|20)\d{2}/);
            const qual = fName.match(/\d{3,4}p|4K|HDR/i);
            const lang = fName.match(/Hindi|English|Bengali|Dual|Multi/i);

            document.getElementById('m-name').innerText = fName.split(/(19|20)\d{2}/)[0].replace(/[._]/g, ' ').trim() || "Movie File";
            document.getElementById('m-year').innerText = year ? year[0] : "N/A";
            document.getElementById('m-quality').innerText = qual ? qual[0].toUpperCase() : "1080p";
            document.getElementById('m-lang').innerText = lang ? lang[0] : "Multi Audio";
        }

        let secondsLeft = 600; 
        setInterval(() => {
            if(secondsLeft <= 0) return;
            secondsLeft--;
            let m = Math.floor(secondsLeft / 60);
            let s = secondsLeft % 60;
            document.getElementById('countdown').innerText = `${m}:${s < 10 ? '0'+s : s}`;
        }, 1000);

        const player = new Plyr('#player', {
            quality: { default: 1080, options: [2160, 1080, 720, 480] }
        });

        function startStream() {
            document.getElementById('mainUI').style.display = 'none';
            document.getElementById('streamOverlay').style.display = 'flex';
            player.play();
        }

        function closeStream() {
            player.pause();
            document.getElementById('streamOverlay').style.display = 'none';
            document.getElementById('mainUI').style.display = 'block';
        }

        function openApp(pkg) {
            window.location.href = `intent:{{ file_url }}#Intent;package=${pkg};S.title={{ file_name }};end`;
        }

        function copyText(v) {
            navigator.clipboard.writeText(v);
            alert("কপি করা হয়েছে!");
        }

        window.onload = parseInfo;
    </script>
</body>
</html>
