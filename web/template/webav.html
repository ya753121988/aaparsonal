<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>AV BOTZ | {{ file_name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="https://img.sanishtech.com/u/62e636411ff87f8ccbdd9eb50eb18279.png" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://av-botz.vercel.app/2626/style.css">
</head>

<body>

    <nav class="navbar anim-entry">
        <div class="container d-flex justify-content-center">
            <a href="#" class="navbar-brand text-decoration-none">
                <i class="fa-solid fa-robot me-2" style="color: var(--accent-color);"></i> AV BOTZ
            </a>
        </div>
    </nav>

    <main class="container py-4">

        <!-- Watch Stream / Player Section -->
        <div class="player-wrapper mb-4 anim-entry delay-1" id="videoContainer">
            <video id="myVideo" playsinline controls class="w-100 h-100">
                <source src="{{ file_url }}" type="video/mp4" />
                <source src="{{ file_url }}" type="video/mkv" />
                Your browser does not support the video tag.
            </video>
        </div>

        <!-- File Details -->
        <div class="glass-card anim-entry delay-2 mb-4">
            <div class="info-row">
                <span style="color: #ccc;">Filename:</span>
                <span class="info-value">{{ file_name }}</span>
            </div>
            <div class="info-row">
                <span style="color: #ccc;">Size:</span>
                <span class="info-value">{{ file_size }}</span>
            </div>
        </div>

        <!-- External Players Section -->
        <div class="row g-2 mb-3 anim-entry delay-3">
            <div class="col-6">
                <a onclick="play_intent('com.mxtech.videoplayer.ad')" class="btn-glass">
                    <i class="fa-solid fa-play"></i> MX Player
                </a>
            </div>
            <div class="col-6">
                <a onclick="play_intent('org.videolan.vlc')" class="btn-glass">
                    <i class="fa-solid fa-cone"></i> VLC Player
                </a>
            </div>
            <div class="col-12">
                <a onclick="play_intent('com.playit.videoplayer')" class="btn-glass">
                    <i class="fa-solid fa-circle-play"></i> PlayIt Player
                </a>
            </div>
        </div>

        <!-- Download Buttons Section -->
        <div class="row g-2 anim-entry delay-3">
            <div class="col-12">
                <a href="{{ file_url }}" class="btn-glass" style="background: rgba(40, 167, 69, 0.2); border: 1px solid #28a745;">
                    <i class="fa-solid fa-bolt"></i> Fast Download
                </a>
            </div>
            <div class="col-6">
                <a href="{{ file_url }}" class="btn-glass">
                    <i class="fa-solid fa-cloud-arrow-down"></i> Download
                </a>
            </div>
            <div class="col-6">
                <a href="{{ file_get }}" target="_blank" class="btn-glass btn-telegram">
                    <i class="fa-brands fa-telegram"></i> Get File
                </a>
            </div>
        </div>

    </main>

    <footer class="text-center py-4">
        <p class="mb-0">🔹 Official content by AV BOTZ <br> @AV_BOTz_UPDATE &copy; 2025</p>
    </footer>

    <script>
        // Watermark and Video Config
        window.siteConfig = {
            thumbnailUrl: "https://img.sanishtech.com/u/29b202409346d1bc163738eb0cab22fa.png",
            watermarkText: "@AV_BOTz_UPDATE",
            videoUrl: "{{ file_url }}" 
        };
    </script>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://av-botz.vercel.app/2626/script.js"></script>
</body>
</html>
