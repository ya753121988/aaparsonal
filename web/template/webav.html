<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8" />
    <title>AV BOTZ | {{ file_name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="https://img.sanishtech.com/u/62e636411ff87f8ccbdd9eb50eb18279.png" type="image/x-icon">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://av-botz.vercel.app/2626/style.css">

    <style>
        :root { --accent: #00d2ff; --glass: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Outfit', sans-serif; background: #0a0a0b; color: white; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* 4 Data Boxes */
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 20px 15px; }
        .info-box { background: var(--glass); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .info-box strong { color: var(--accent); font-size: 13px; display: block; margin-top: 2px; }

        /* Timer UI */
        .timer-box { background: rgba(255, 0, 0, 0.1); border: 1px solid rgba(255, 0, 0, 0.3); padding: 8px; margin: 0 15px 15px; border-radius: 8px; text-align: center; color: #ff6b6b; font-size: 12px; font-weight: bold; }

        /* Buttons Style */
        .action-container { padding: 0 15px; }
        .main-btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; color: white; cursor: pointer; font-size: 16px; position: relative; overflow: hidden; }
        
        .btn-watch { background: linear-gradient(45deg, #a55eea, #4b7bec); }
        .btn-download { background: #2ecc71; }
        .btn-telegram { background: #0088cc; }
        
        .player-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 15px; }
        .p-btn { background: var(--glass); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); color: white; text-decoration: none; font-size: 12px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; cursor: pointer; position: relative; }

        /* Step Count Badge */
        .step-badge { position: absolute; top: 0; right: 0; background: yellow; color: #000; font-size: 9px; padding: 1px 6px; border-bottom-left-radius: 8px; font-weight: 900; }

        /* Overlay Stream Player (TikTok Fix) */
        #streamOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .close-stream { position: absolute; top: 15px; left: 15px; z-index: 10005; background: #ff4757; color: white; border: none; padding: 6px 14px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .player-watermark { position: absolute; top: 18px; right: 18px; z-index: 10005; font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.4); pointer-events: none; }

        .video-player-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
        #player { max-height: 100vh; width: auto; max-width: 100%; }
        .plyr--video { height: auto !important; width: 100% !important; max-height: 100vh; }
    </style>
</head>

<body>
    <canvas id="particle-canvas"></canvas>

    <div id="mainUI">
        <!-- Movie Info Boxes -->
        <div class="info-grid">
            <div class="info-box"><span>Movie Name</span><strong id="m-name">Parsing...</strong></div>
            <div class="info-box"><span>Language</span><strong id="m-lang">Detecting...</strong></div>
            <div class="info-box"><span>Year</span><strong id="m-year">2024</strong></div>
            <div class="info-box"><span>Quality</span><strong id="m-quality">1080p</strong></div>
        </div>

        <div class="timer-box">
            <i class="fa-solid fa-clock"></i> ফাইল ডিলিট হতে বাকি: <span id="countdown">10:00</span>
        </div>

        <!-- Main Buttons -->
        <div class="action-container">
            <button class="main-btn btn-watch" onclick="handleDynamicStep(this, startStream)">
                <span class="step-badge">Loading...</span>
                <i class="fa-solid fa-circle-play"></i> <span>Watch Online</span>
            </button>

            <button class="main-btn btn-download" onclick="handleDynamicStep(this, () => window.location.href = '{{ file_url }}')">
                <span class="step-badge">Loading...</span>
                <i class="fa-solid fa-cloud-arrow-down"></i> <span>Download Now</span>
            </button>

            <button class="main-btn btn-telegram" onclick="handleDynamicStep(this, () => window.open('{{ file_get }}', '_blank'))">
                <span class="step-badge">Loading...</span>
                <i class="fa-brands fa-telegram"></i> <span>View in Telegram</span>
            </button>
        </div>

        <!-- External Players Grid -->
        <div class="player-grid">
            <div onclick="handleDynamicStep(this, () => openApp('com.mxtech.videoplayer.ad'))" class="p-btn"><span class="step-badge">..</span><i class="fa-solid fa-play" style="color: #2196F3;"></i> MX Player</div>
            <div onclick="handleDynamicStep(this, () => openApp('org.videolan.vlc'))" class="p-btn"><span class="step-badge">..</span><i class="fa-solid fa-cone" style="color: #FF9800;"></i> VLC Player</div>
            <div onclick="handleDynamicStep(this, () => openApp('com.playit.videoplayer'))" class="p-btn"><span class="step-badge">..</span><i class="fa-solid fa-circle-play" style="color: #00C853;"></i> PlayIt</div>
            <div onclick="handleDynamicStep(this, () => openApp('com.google.android.apps.photos'))" class="p-btn"><span class="step-badge">..</span><i class="fa-brands fa-google" style="color: #ea4335;"></i> Photos</div>
        </div>
    </div>

    <!-- Overlay Player -->
    <div id="streamOverlay" style="display: none;">
        <button class="close-stream" onclick="closeStream()">CLOSE X</button>
        <div class="player-watermark">@AV_BOTz_UPDATE</div>
        <div class="video-player-container">
            <video id="player" playsinline controls crossorigin="anonymous">
                <source src="{{ file_url }}" type="video/mp4" />
                <source src="{{ file_url }}" type="video/x-matroska" />
            </video>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        // ==========================================
        // ১. এক জায়গায় কন্ট্রোল (কমানো/বাড়ানো)
        // ==========================================
        const TOTAL_STEPS = 1; // এখানে ২ দিলে ২টা ক্লিক লাগবে, ১ দিলে ১টা।
        const ADSTERRA_LINK = "https://www.effectivecpmnetwork.com/xqmb731x1?key=0267816362fc4320de630e064b317db1"; // আপনার এড লিংক

        // ==========================================

        let btnStateTracker = new Map();

        function handleDynamicStep(btn, successAction) {
            if (!btnStateTracker.has(btn)) {
                btnStateTracker.set(btn, 1);
            }

            let currentStep = btnStateTracker.get(btn);
            let badge = btn.querySelector('.step-badge');

            if (currentStep <= TOTAL_STEPS) {
                // এড ওপেন করা
                window.open(ADSTERRA_LINK, '_blank');
                
                // পরবর্তী স্টেপে যাওয়া
                if (currentStep < TOTAL_STEPS) {
                    btnStateTracker.set(btn, currentStep + 1);
                    updateBadgeText(btn);
                    alert(`Step ${currentStep} সম্পন্ন! পরবর্তী স্টেপের জন্য আবার ক্লিক করুন।`);
                } else {
                    // এটিই শেষ স্টেপ ছিল, এখন মেইন কাজ হবে
                    successAction();
                    btnStateTracker.set(btn, 1); // রিসেট
                    updateBadgeText(btn);
                }
            }
        }

        function updateBadgeText(btn) {
            let step = btnStateTracker.get(btn) || 1;
            let badge = btn.querySelector('.step-badge');
            if(badge) badge.innerText = `Step ${step}/${TOTAL_STEPS}`;
        }

        // Initialize all badges on load
        function initBadges() {
            document.querySelectorAll('.main-btn, .p-btn').forEach(btn => {
                updateBadgeText(btn);
            });
        }

        function parseInfo() {
            const fName = "{{ file_name }}";
            document.getElementById('m-name').innerText = fName.split(/(19|20)\d{2}/)[0].replace(/[._]/g, ' ').trim() || "Movie File";
        }

        const player = new Plyr('#player', { quality: { default: 1080, options: [2160, 1080, 720, 480] } });

        function startStream() {
            document.getElementById('mainUI').style.display = 'none';
            document.getElementById('streamOverlay').style.display = 'flex';
            player.play();
        }

        function closeStream() {
            player.pause();
            document.getElementById('streamOverlay').style.display = 'none';
            document.getElementById('mainUI').style.display = 'block';
        }

        function openApp(pkg) {
            window.location.href = `intent:{{ file_url }}#Intent;package=${pkg};S.title={{ file_name }};end`;
        }

        window.onload = () => {
            parseInfo();
            initBadges();
        };
    </script>
</body>
</html>
